          burst(at[0], at[1], 22 + 40 * k, {
            speed: [50, 160 + 120 * k],
            life: [0.15, 0.4 + 0.3 * k],
            g: 220,
            cols: ["#ffffff", C.f0, C.f1, "#aebfe0"],
            size: [1, 2 + k],
          });
          burst(at[0], at[1], 6 + 22 * k, {
            speed: [160, 320],
            life: [0.12, 0.3],
            g: 260,
            cols: ["#ffffff", C.f0, C.f1],
            streak: true,
          });
          if (k > 0 || finale)
            fx.push({
              type: "ring",
              t: 0,
              dur: 0.3 + 0.2 * k,
              x: at[0],
              y: at[1],
              r1: 30 + 60 * Math.max(k, finale ? 1 : 0),
            });
          d.flinch = 0.4 + 0.8 * k;
          d.flinchDir = at[0] < 128 ? 1 : -1;
          if (finale) startCinematic(at);
          else {
            game.star = {
              t: 0,
              dur: 0.1 + 0.12 * k,
              x: at[0],
              y: at[1],
              s: 12 + 20 * k,
            };
            hitstop(0.09 + 0.13 * k);
            shake(3 + 5 * k, 0.18 + 0.25 * k);
            flashScreen("#ffffff", 0.35 + 0.25 * k, 0.08 + 0.06 * k);
            punch(0.025 + 0.05 * k, at);
            if (k >= 1) {
              game.impactT = 0.07;
              game.slowT = game.slowDur = 0.35;
            }
            if (k > 0) sfx.parryHeavy(k);
            else sfx.parry();
          }
          if (L.onParry) L.onParry(at);
          // knight's exchange: he reels open and you have to swing
          if (d.queue.length && d.queue[0].open) {
            d.queue.shift();
            d.state = "open";
            d.t = 0;
            return;
          }
          if (d.queue.length) {
            d.state = "deflect";
            d.t = 0;
            d.deflectDur = L.deflect[d.moveKey];
            return;
          }
          d.state = "stunned";
          d.t = 0;
          d.openHits = 0;
          d.stunDur = d.chain === "rage" ? CFG.comboStun : d.move.stun;
        } else if (d.state !== "stunned" && d.state !== "deflect") {
          // a nervous double-tap after a parry shouldn't cost the counterattack
          Object.assign(player, {
            shieldMode: "whiff",
            shieldT: 0,
            lock: CFG.whiffLock,
          });
          sfx.whiff();
        }
      }
      function doAttack() {
        const d = boss;
        player.swingT = 0;
        player.lock = CFG.attackCooldown;
        sfx.swing();
        if (d.state === "stunned") {
          d.hits++;
          stats.hits++;
          d.flash = 0.07;
          d.flinch = 1;
          d.flinchDir = -d.flinchDir;
          hitstop(0.05);
          shake(2, 0.12);
          sfx.hit();
          // a knight's lit crack is where the sparks come from
          const [sx, sy] =
            lastPose && lastPose.weak > 0
              ? lastPose.weakAt
              : [rand(116, 150), rand(104, 132)];
          burst(sx, sy, 14, {
            speed: [30, 120],
            life: [0.15, 0.35],
            g: 120,
            cols: ["#ffffff", "#ffe0a0", L.sparks],
            size: [1, 2],
          });
          d.openHits = (d.openHits || 0) + 1;
          if (d.hits >= CFG.bossHits) bossDies();
          else if (
            L.counterAfter &&
            d.chain !== "rage" &&
            d.openHits >= L.counterAfter
          ) {
            // the knight only gives you so many: his visor flares and the shield comes up
            d.state = "guard";
            d.t = 0;
            sfx.guardUp();
          }
        } else if (d.state === "open" || d.state === "guard") {
          parriedByBoss(d.state === "open");
        } else if (d.state === "windup" && d.move.channel) {
          interrupt();
        } else {
          Object.assign(player, {
            lock: CFG.blockedLock,
            recoilT: 0,
            swingT: -1,
          });
          sfx.block();
          shake(1, 0.1);
          burst(150, 120, 8, {
            speed: [40, 110],
            life: [0.1, 0.25],
            g: 200,
            cols: ["#ffffff", "#aab0c0"],
          });
          if (L.onBlock) L.onBlock();
          if (d.state === "idle" && Math.random() < 0.6) {
            d.forced = L.counter;
            d.idleDur = Math.min(d.idleDur, d.t + 0.12);
          }
        }
      }
      function bossDies() {
        const d = boss;
        d.state = "dying";
        d.t = 0;
        game.mode = "winAnim";
        game.modeT = 0;
        hitstop(0.3);
        L.death(0.7);
      }
      // your sword breaks a channelled spell (the lich's curse): it counts as a hit and he reels.
      // Mid-combo he shakes it off and carries on; otherwise he's open for more
      function interrupt() {
        const d = boss,
          at = lastPose && lastPose.weakAt ? lastPose.weakAt : [128, 104];
        d.hits++;
        stats.hits++;
        silence(d.channelSnd);
        d.channelSnd = null;
        d.flash = 0.08;
        d.flinch = 1.6;
        d.flinchDir = -d.flinchDir;
        game.star = { t: 0, dur: 0.18, x: at[0], y: at[1], s: 26 };
        fx.push({ type: "ring", t: 0, dur: 0.4, x: at[0], y: at[1], r1: 80 });
        hitstop(0.14);
        shake(6, 0.3);
        flashScreen("#ffffff", 0.45, 0.1);
        punch(0.05, at);
        sfx.hit();
        sfx.shatter();
        if (L.onInterrupt) L.onInterrupt(at);
        if (d.hits >= CFG.bossHits) bossDies();
        else if (d.queue.length) {
          d.state = "deflect";
          d.t = 0;
          d.deflectDur = L.deflect[d.moveKey];
        } else {
          Object.assign(d, {
            state: "stunned",
            t: 0,
            openHits: 0,
            stunDur: d.move.stun,
          });
        }
      }
      // the knight parries your swing. In the exchange you then parry him; out of it he ripostes
      function parriedByBoss(exchange) {
        const d = boss;
        Object.assign(player, {
          lock: exchange ? 0.2 : CFG.counteredLock,
          recoilT: 0,
          swingT: -1,
        });
        sfx.clash();
        shake(3, 0.15);
        hitstop(0.06);
        burst(136, 106, 18, {
          speed: [60, 180],
          life: [0.12, 0.3],
          g: 220,
          cols: ["#ffffff", "#ffe0a0", "#aebfe0"],
          streak: true,
        });
        d.state = "clash";
        d.t = 0;
        d.clashNext = exchange ? "chain" : "riposte";
      }
      function act(a) {
        if (game.mode !== "fight" || game.cine) return;
        if (player.lock > 0) {
          player.buffer = { act: a, at: game.realTime };
          return;
        }
        if (a === "parry") doParry();
        else doAttack();
      }

      function updateBoss(dt) {
        const d = boss;
        d.t += dt;
        switch (d.state) {
          case "idle":
            if (game.mode === "fight" && d.t >= d.idleDur) nextAttack();
            break;
          case "snarl":
            if (d.t >= 0.5) startCombo();
            break;
          case "windup":
            if (
              L.glintLead &&
              !d.feint &&
              !d.glinted &&
              d.t >= d.windup - L.glintLead
            ) {
              d.glinted = true;
              sfx.ting();
            }
            if (d.t >= d.windup) {
              if (d.feint) {
                d.state = "feint";
                d.t = 0;
                sfx.feint();
              } else {
                d.state = "strike";
                d.t = 0;
                sfx[d.moveKey + "Strike"]();
              }
            }
            break;
          case "feint":
            // inside a combo the fake flows into the next scripted step; on its own it switches to its paired attack
            if (d.t >= CFG.feintHitch) {
              if (d.queue.length) nextInChain();
              else {
                d.chain = "feint";
                startMove(L.feintInto[d.moveKey], { chained: true });
              }
            }
            break;
          case "strike":
            if (d.t >= d.move.window) landHit();
            break;
          case "stunned":
          case "deflect":
            // only a parry that ends the attack throws the fireball back in its face; mid-chain it's batted aside
            if (
              d.state === "stunned" &&
              d.moveKey === "fire" &&
              !d.exploded &&
              d.t >= 0.24
            ) {
              d.exploded = true;
              d.flash = 0.1;
              d.flinch = 1.6;
              const [hx, hy] = lastPose.head,
                big = game.cine ? 2.5 : 1;
              burst(hx, hy + 14, 40 * big, {
                speed: [20, 100 * big],
                life: [0.3, 0.7],
                g: -30,
                drag: 2,
                cols: FIRE,
                size: [2, 2 + big],
              });
              burst(hx, hy + 10, 12 * big, {
                speed: [10, 40],
                life: [0.8, 1.4],
                g: -20,
                drag: 1,
                cols: SMOKE,
                size: [2, 4],
                layer: 1,
              });
              // in the cinematic this plays at quarter speed, so keep the flash and ring short in game time
              if (game.cine) {
                d.flash = 0.04;
                fx.push({
                  type: "ring",
                  t: 0,
                  dur: 0.25,
                  x: hx,
                  y: hy + 14,
                  r1: 110,
                });
                flashScreen("#ffb040", 0.45, 0.12);
              }
              sfx.boom();
              shake(4 * big, 0.3 * big);
            }
            if (d.state === "deflect" && d.t >= d.deflectDur) nextInChain();
            else if (d.state === "stunned" && d.t >= d.stunDur) {
              d.state = "recover";
              d.t = 0;
            }
            break;
          case "recover":
            if (d.t >= 0.35) toIdle();
            break;
          case "open":
            // you didn't swing: he steps in with a shield bash you can't parry
            if (d.t >= CFG.openWindow) startMove("bash", { chained: true });
            break;
          case "clash":
            if (d.t >= 0.28) {
              if (d.clashNext === "chain") nextInChain();
              else {
                d.queue = [];
                d.chain = "riposte";
                startMove("cut", { chained: true, windup: CFG.riposte });
              }
            }
            break;
          case "guard":
            if (d.t >= CFG.guardTime) toIdle(0.3);
            break;
          case "follow":
            if (d.t >= d.followDur) {
              if (d.queue.length && game.mode === "fight") nextInChain();
              else toIdle();
            }
            break;
          case "rageRoar":
            if (d.t >= 1.3) toIdle(0.3);
            break;
          case "dying":
            if (d.t > 1.7 && Math.random() < 0.5)
              burst(rand(40, 216), 196, 2, {
                ang: -Math.PI / 2,
                spread: 1.2,
                speed: [10, 40],
                life: [0.6, 1.2],
                g: -5,
                drag: 1,
                cols: ["#5a4d7a", "#3b3058", "#2a2140"],
                size: [2, 3],
                layer: 1,
              });
            if (d.t >= 3.4 && game.mode === "winAnim") endScreen(true);
            break;
        }
      }

      function dragonAmbient(dt) {
        const d = boss,
          p = lastPose;
        if (!p || !p.head) return;
        const [hx, hy] = p.head;
        const smokeRate = d.state === "stunned" ? 5 : d.raged ? 3 : 0.5;
        if (Math.random() < smokeRate * dt)
          for (const m of [-1, 1])
            parts.push({
              x: hx + m * 6 * p.hs,
              y: hy + 19 * p.hs,
              vx: m * rand(2, 8),
              vy: rand(-16, -6),
              g: -4,
              drag: 0.5,
              life: rand(0.6, 1.1),
              t: 0,
              size: 2,
              cols: SMOKE,
              layer: 1,
            });
        if (d.state === "windup" && d.moveKey === "fire") {
          for (let i = 0; i < 2; i++) {
            const a = rand(0, TAU),
              r = rand(24, 44),
              life = rand(0.25, 0.45),
              mx = hx,
              my = hy + 30 * p.hs;
            parts.push({
              x: mx + Math.cos(a) * r,
              y: my + Math.sin(a) * r,
              vx: (-Math.cos(a) * r) / life,
              vy: (-Math.sin(a) * r) / life,
              g: 0,
              drag: 0,
              life,
              t: 0,
              size: 1,
              cols: [C.f2, C.f1, C.f0],
              layer: 1,
            });
          }
        }
        if (
          d.state === "windup" &&
          d.moveKey === "tail" &&
          p.tailTip &&
          p.tailGlow > 0
        ) {
          const [tx, ty] = p.tailTip,
            a = rand(0, TAU),
            r = rand(14, 26),
            life = rand(0.2, 0.35);
          parts.push({
            x: tx + Math.cos(a) * r,
            y: ty + Math.sin(a) * r,
            vx: (-Math.cos(a) * r) / life,
            vy: (-Math.sin(a) * r) / life,
            g: 0,
            drag: 0,
            life,
            t: 0,
            size: 1,
            cols: [C.f3, C.f2, C.f1],
            layer: 1,
          });
        }
        if (Math.random() < 5 * dt)
          parts.push({
            x: rand(0, W),
            y: H,
            vx: rand(-4, 4),
            vy: rand(-30, -14),
            g: 0,
            drag: 0,
            life: rand(2, 4),
            t: 0,
            size: 1,
            cols: [C.f1, C.f2, C.f3, C.f4],
            layer: 0,
          });
      }

      /* ================= Dragon pose for the current frame ================= */
      function dragonPose() {
        const d = boss,
          T = game.time,
          st = d.state,
          mk = d.moveKey,
          mode = game.mode;
        const p = {
          bx: 0,
          by: Math.sin(T * 2.2) * 1.5,
          sink: 0,
          flap: Math.sin(T * 1.7) * 0.22,
          hxo: Math.sin(T * 1.1) * 1.2,
          hyo: Math.sin(T * 2.2 + 0.6) * 1.2,
          hs: 1,
          jaw: 0,
          tongue: false,
          mouthFlash: false,
          glow: 0,
          eyes: d.raged ? "rage" : "open",
          tail: "rest",
          tailP: 0,
          tailShake: 0,
          tailGlow: 0,
          sweepX: null,
          tailFlash: false,
          stars: 0,
          glint: 0,
          hang: 0,
          arm: null,
        };
        if (d.blink > 0) p.eyes = "blink";
        const roar = (r) => {
          p.jaw = Math.max(p.jaw, r);
          p.hyo -= 9 * r;
          p.hs -= 0.05 * r;
          p.flap = lerp(p.flap, 1, r);
          p.by -= 2 * r;
          p.hxo += Math.sin(T * 40) * r;
          if (r > 0.3) p.eyes = "glow";
        };
        const daze = (b) => {
          p.by += 4 * b;
          p.hxo = lerp(p.hxo, Math.sin(T * 5) * 4, b);
          p.hyo += 7 * b;
          p.hs -= 0.03 * b;
          p.jaw = Math.max(p.jaw, 0.35 * b);
          p.tongue = b > 0.5;
          p.flap = lerp(p.flap, -0.55, b);
          p.stars = b;
          p.hang = b;
          if (b > 0.3) p.eyes = "dizzy";
        };
        const m = d.side;

        if (mode === "intro") {
          const u = game.modeT / 1.9;
          roar(smooth(0.1, 0.28, u) * (1 - smooth(0.72, 0.92, u)));
        } else if (mode === "loseAnim" || mode === "lose") {
          const u = game.modeT;
          roar(smooth(0.5, 0.8, u) * (1 - smooth(1.8, 2.2, u)));
        } else if (st === "rageRoar")
          roar(smooth(0, 0.2, d.t / 1.3) * (1 - smooth(0.75, 1, d.t / 1.3)));
        else if (st === "snarl") {
          const r =
            0.7 * smooth(0, 0.3, d.t / 0.5) * (1 - smooth(0.8, 1, d.t / 0.5));
          roar(r);
          p.hxo += Math.sin(T * 35) * 2 * r;
        } else if (st === "windup" && mk === "claw") {
          const t = d.t / d.windup,
            e = easeOut(clamp(t / 0.7, 0, 1)),
            an = smooth(0.7, 1, t);
          p.bx = -m * 5 * e;
          p.hxo -= m * 3 * e;
          p.jaw = 0.15 * e;
          p.flap += 0.15 * e;
          p.arm = (a, cx, by) => {
            if (a.m !== m) return;
            a.hx =
              lerp(a.hx, cx + m * 66, e) +
              m * 5 * an +
              (Math.random() - 0.5) * an;
            a.hy = lerp(a.hy, 56 + by, e) - 5 * an;
            a.ex = lerp(a.ex, cx + m * 58, e);
            a.ey = lerp(a.ey, 90 + by, e);
            a.ang = 2.6 * m * e;
          };
        } else if (st === "strike" && mk === "claw") {
          const t = clamp(d.t / d.move.window, 0, 1),
            k = t ** 1.6;
          p.bx = lerp(-m * 5, m * 8, k);
          p.hxo += lerp(-m * 3, m * 4, k);
          p.jaw = lerp(0.15, 0.5, k);
          p.eyes = "glow";
          if (t < 0.5) p.glint = m;
          p.arm = (a, cx, by) => {
            if (a.m !== m) return;
            a.hx = lerp(cx + m * 71, 128 - m * 6, k);
            a.hy = lerp(51 + by, 150, k);
            a.s = lerp(1, 3.2, k);
            a.ex = lerp(cx + m * 58, cx + m * 54, k);
            a.ey = lerp(90 + by, 116 + by, k);
            a.ang = lerp(2.6 * m, 0.64 * m, k);
          };
        } else if (st === "windup" && mk === "tail") {
          const t = d.t / d.windup,
            e = easeOut(clamp(t / 0.5, 0, 1));
          p.bx = -12 * e;
          p.by += 4 * e;
          p.hxo -= 4 * e;
          p.hyo += 2 * e;
          p.flap = lerp(p.flap, -0.35, e);
          p.tail = "raised";
          p.tailP = e;
          p.tailShake = t * t;
          p.tailGlow = smooth(0.45, 1, t);
          p.jaw = 0.25 * smooth(0.6, 1, t);
          if (t > 0.5) p.eyes = "glow";
          p.arm = (a, cx, by) => {
            if (a.m < 0) {
              a.hx = lerp(a.hx, cx - 48, e);
              a.hy = lerp(a.hy, 170 + by, e);
              a.ex = lerp(a.ex, cx - 56, e);
              a.ey = lerp(a.ey, 140 + by, e);
            } else {
              a.hx = lerp(a.hx, cx + 18, e);
              a.hy = lerp(a.hy, 152 + by, e);
            }
          };
        } else if (st === "strike" && mk === "tail") {
          const t = clamp(d.t / d.move.window, 0, 1);
          p.tail = "none";
          p.sweepX = lerp(W - 6, 52, t ** 1.15);
          p.tailFlash = t < 0.4;
          p.bx = lerp(-12, 14, t);
          p.hxo += lerp(-4, 6, t);
          p.by += lerp(4, 0, t);
          p.eyes = "glow";
          p.jaw = 0.4;
        } else if ((st === "windup" || st === "strike") && mk === "fire") {
          const sn =
            st === "strike" ? 1 : clamp((d.t - (d.windup - 0.1)) / 0.1, 0, 1);
          const e = st === "strike" ? 1 : easeOut(clamp(d.t / 0.4, 0, 1)),
            t = st === "strike" ? 1 : clamp(d.t / d.windup, 0, 1);
          p.hyo += lerp(-9 * e, 5, sn);
          p.hs = lerp(1 - 0.07 * e, 1.07, sn);
          p.jaw = lerp(0.18 * e, 1, sn);
          p.glow =
            st === "strike" ? 1 - 0.7 * clamp(d.t / d.move.window, 0, 1) : t;
          p.mouthFlash = sn > 0.3 && st === "windup";
          p.flap = lerp(lerp(p.flap, 0.9, e), 0.2, sn);
          p.by -= 3 * e * (1 - sn);
          p.eyes = "glow";
          p.arm = (a, cx, by) => {
            a.hx = lerp(a.hx, cx + a.m * 54, e);
            a.hy = lerp(a.hy, 148 + by, e);
            a.ex = lerp(a.ex, cx + a.m * 54, e);
            a.ey = lerp(a.ey, 124 + by, e);
          };
        } else if (st === "stunned" || st === "deflect") {
          if (st === "stunned") daze(easeOut(clamp(d.t / 0.3, 0, 1)));
          else if (d.raged) p.eyes = "rage";
          if (mk === "claw") {
            p.arm = (a, cx, by) => {
              if (a.m !== m) return;
              if (d.t < 0.12) {
                const k = easeOut(d.t / 0.12);
                a.hx = lerp(128 - m * 6, cx + m * 74, k);
                a.hy = lerp(150, 42 + by, k);
                a.s = lerp(3.2, 1.1, k);
                a.ex = cx + m * 60;
                a.ey = 96 + by;
                a.ang = 2.6 * m;
              } else if (d.t < 0.45) {
                const k = easeOut((d.t - 0.12) / 0.33);
                a.hx = lerp(cx + m * 74, a.hx, k);
                a.hy = lerp(42 + by, a.hy, k);
                a.s = lerp(1.1, 1, k);
                a.ex = lerp(cx + m * 60, a.ex, k);
                a.ey = lerp(96 + by, a.ey, k);
                a.ang = lerp(2.6 * m, 0, k);
              }
            };
          } else if (mk === "tail") {
            if (d.t < 0.35) {
              p.tail = "none";
              p.sweepX = lerp(52, W + 80, easeOut(d.t / 0.35));
            }
            p.bx += lerp(14, 0, easeOut(clamp(d.t / 0.5, 0, 1)));
          } else if (mk === "fire") {
            p.jaw = Math.max(p.jaw, 1 - d.t / 0.35);
            p.hyo += 5 * (1 - clamp(d.t / 0.3, 0, 1));
          }
        } else if (st === "recover") {
          const u = clamp(d.t / 0.35, 0, 1),
            b = 1 - easeOut(u);
          daze(b);
          p.stars = b;
          p.hxo += Math.sin(u * TAU * 2.5) * 6 * (1 - u);
          if (b < 0.3) p.eyes = d.raged ? "rage" : "open";
        } else if (st === "follow") {
          const u = clamp(d.t / d.followDur, 0, 1);
          if (mk === "claw") {
            p.bx = lerp(m * 8, 0, easeOut(u));
            p.arm = (a, cx, by) => {
              if (a.m !== m) return;
              if (u < 0.22) {
                const k = u / 0.22;
                a.hx = lerp(128 - m * 6, 128 - m * 100, k);
                a.hy = lerp(150, 236, k);
                a.s = lerp(3.2, 3.6, k);
                a.ex = cx + m * 54;
                a.ey = 116 + by;
                a.ang = 0.64 * m;
              } else {
                const k = easeOut((u - 0.22) / 0.78);
                a.hx = lerp(128 - m * 100, a.hx, k);
                a.hy = lerp(236, a.hy, k);
                a.s = lerp(3.6, 1, k);
                a.ex = lerp(cx + m * 54, a.ex, k);
                a.ey = lerp(116 + by, a.ey, k);
                a.ang = lerp(0.64 * m, 0, k);
              }
            };
          } else if (mk === "tail") {
            if (d.t < 0.18) {
              p.tail = "none";
              p.sweepX = lerp(52, -330, d.t / 0.18);
            }
            p.bx = lerp(
              14,
              0,
              easeOut(clamp((d.t - 0.1) / (d.followDur - 0.1), 0, 1)),
            );
          } else if (mk === "fire") {
            p.jaw = 1 - easeOut(u);
            p.hyo += 5 * (1 - u);
            p.hs = lerp(1.07, 1, u);
          }
        } else if (st === "dying") {
          const u = d.t;
          if (u < 0.6) {
            daze(1);
            p.bx += Math.sin(u * 60) * 3 * (1 - u / 0.6);
          } else if (u < 1.6) {
            const r = smooth(0.6, 0.9, u);
            roar(r);
            p.hyo -= 6 * r;
            p.hxo += Math.sin(T * 50) * 2 * r;
          } else {
            const c = clamp((u - 1.6) / 1.4, 0, 1);
            roar(1 - smooth(1.6, 2.0, u));
            p.eyes = "dizzy";
            p.hang = 1;
            p.sink = 130 * c * c;
            p.hyo += 18 * c;
            p.flap = lerp(1, -1, clamp((u - 1.6) / 0.5, 0, 1));
            p.bx += Math.sin(u * 3) * 6 * c;
          }
        }

        if (d.flinch > 0) {
          p.bx += d.flinchDir * 7 * d.flinch;
          p.hxo += d.flinchDir * 5 * d.flinch;
          p.hyo += 3 * d.flinch;
        }
        const cx = 128 + p.bx,
          by = p.by;
        p.arms = [-1, 1].map((side) => {
          const a = {
            m: side,
            sx: cx + side * 26,
            sy: 106 + by,
            ex: cx + side * 44,
            ey: 134 + by,
            hx: cx + side * 32,
            hy: 158 + by,
            s: 1,
            ang: 0,
          };
          if (p.hang) {
            a.ex = lerp(a.ex, cx + side * 50, p.hang);
            a.ey = lerp(a.ey, 142 + by, p.hang);
            a.hx = lerp(a.hx, cx + side * 40, p.hang);
            a.hy = lerp(a.hy, 174 + by, p.hang);
          }
          if (p.arm) p.arm(a, cx, by);
          return a;
        });
        return p;
      }

      function fireballNow(p) {
        const d = boss;
        if (d.moveKey !== "fire" || !p.head) return null;
        const mx = p.head[0],
          my = p.head[1] + 30 * p.hs;
        if (d.state === "strike") {
          const k = clamp(d.t / d.move.window, 0, 1) ** 2;
          return {
            x: lerp(mx, 118, k),
            y: lerp(my, 132, k),
            r: lerp(5, 58, k),
            stream: [mx, my],
          };
        }
        if (d.state === "deflect" && d.t < d.deflectDur) {
          const k = d.t / d.deflectDur;
          return {
            x: lerp(118, d.side > 0 ? W + 50 : -50, k),
            y: lerp(132, 50, k),
            r: lerp(52, 22, k),
          };
        }
        if (d.state === "stunned" && d.t < 0.24) {
          const k = d.t / 0.24;
          return {
            x: lerp(118, mx, k),
            y: lerp(132, my - 12, k),
            r: lerp(52, 9, k * (2 - k)),
          };
        }
        if (d.state === "follow" && d.t < 0.12)
          return { x: 118, y: 132, r: lerp(58, 140, d.t / 0.12) };
        return null;
      }

      /* ================= Render ================= */
      function render() {
        const p = L.pose();
        g = ctx;
        ctx.globalAlpha = 1;
        // impact frame: a beat of black with the boss burned white
        const impact = game.impactT > 0,
          ck = cineAmount();
        if (impact) rect(0, 0, W, H, "#07050d");
        else {
          ctx.drawImage(L.bg, 0, 0);
          L.backdrop();
          drawParticles(0);
          if (ck > 0) {
            ctx.globalAlpha = 0.55 * ck;
            rect(0, 0, W, H, "#07050d");
            ctx.globalAlpha = 1;
            focusLines(game.cine.focus[0], game.cine.focus[1], ck);
          }
          if (p.sink < 100)
            ell(
              128 + p.bx * 0.5,
              196,
              L.shadow[0] - p.sink * 0.4,
              9,
              L.shadow[1],
            );
        }
        const flash =
          impact ||
          boss.flash > 0 ||
          (boss.state === "dying" &&
            boss.t > 0.6 &&
            boss.t < 1.6 &&
            Math.floor(boss.t * 12) % 2 === 0);
        drawBossLayer(p, flash);
        lastPose = p;
        if (!impact) L.front(p);
        if (game.star) {
          const u = game.star.t / game.star.dur;
          ctx.globalAlpha = 1 - u * u;
          starburst(game.star.x, game.star.y, game.star.s * (1 - 0.4 * u));
          ctx.globalAlpha = 1;
        }
        drawParticles(1);
        drawPlayer();
        drawParticles(2);
        if (!impact) drawFx();
        const P = player;
        let va = 0;
        if (P.hurtT >= 0 && P.hurtT < 0.5)
          va = Math.max(va, 0.9 * (1 - P.hurtT / 0.5));
        if (P.hp > 0 && P.hp <= 2 && game.mode === "fight")
          va = Math.max(va, 0.3 + 0.15 * Math.sin(game.time * 6));
        if (game.mode === "loseAnim" || game.mode === "lose") {
          va = 1;
          ctx.globalAlpha = Math.min(0.65, game.modeT * 0.4);
          rect(0, 0, W, H, "#1a0008");
        }
        if (va > 0) {
          ctx.globalAlpha = va;
          ctx.drawImage(vig, 0, 0);
        }
        if (game.mode === "winAnim" && boss.t > 2.6) {
          ctx.globalAlpha = Math.min(0.85, ((boss.t - 2.6) / 0.8) * 0.85);
          rect(0, 0, W, H, "#fff4e0");
        }
        if (game.mode === "win") {
          ctx.globalAlpha = Math.max(0, 0.85 - game.modeT);
          rect(0, 0, W, H, "#fff4e0");
        }
        ctx.globalAlpha = 1;
        drawHud();
        // letterbox bars live outside the canvas so the camera push-in can't scale them off screen
        const bar = ck > 0 ? R(24 * ck) * scale + "px" : "0px";
        barTop.style.height = bar;
        barBot.style.height = bar;
        // camera: shake, the parry punch-in, and the cinematic push toward the boss's face
        const sk = shakeT > 0 ? shakeT / shakeDur : 0,
          c = game.cine,
          ct = c ? c.t : 0;
        const z = reduceMotion
          ? 1
          : 1 +
            (c
              ? 0.22 *
                easeOut(clamp((ct - CINE.freeze) / 0.4, 0, 1)) *
                (1 - smooth(CINE.slowEnd, CINE.end, ct))
              : 0) +
            game.punchAmt * (game.punchT / 0.25);
        if (sk > 0 || z > 1.001) {
          const o = c ? c.focus : game.punchAt || [128, 112];
          cvs.style.transformOrigin = `${o[0] * scale}px ${o[1] * scale}px`;
          cvs.style.transform = `translate(${R((Math.random() * 2 - 1) * shakeMag * sk) * scale}px, ${R((Math.random() * 2 - 1) * shakeMag * sk) * scale}px) scale(${z})`;
        } else cvs.style.transform = "";
      }

      /* ================= Update + flow ================= */
      function update(dt) {
        game.time += dt;
        game.modeT += dt;
        const P = player,
          d = boss;
        if (game.cine && d.state === "stunned") d.stunDur += dt; // the punish window starts once the cinematic ends
        if (P.lock > 0) {
          P.lock -= dt;
          if (P.lock <= 0) {
            P.lock = 0;
            const b = P.buffer;
            P.buffer = null;
            if (b && game.realTime - b.at < 0.16) act(b.act);
          }
        }
        P.shieldT += dt;
        P.shieldFlash = Math.max(0, (P.shieldFlash || 0) - dt);
        if (P.swingT >= 0) P.swingT += dt;
        if (P.recoilT >= 0) P.recoilT += dt;
        if (P.hurtT >= 0) P.hurtT += dt;
        for (const h of hearts) if (h.breakT !== null) h.breakT += dt;
        d.flinch = Math.max(0, d.flinch - dt * 5);
        d.flash -= dt;
        d.blinkT -= dt;
        d.blink -= dt;
        if (d.blinkT < 0) {
          d.blink = 0.12;
          d.blinkT = rand(2, 4.5);
        }

        if (game.mode === "intro") {
          if (!game.roared && game.modeT > 0.4) {
            game.roared = true;
            shake(3, 0.9);
          }
          if (game.modeT >= 1.9) {
            game.mode = "fight";
            game.modeT = 0;
            toIdle(0.7);
          }
        } else if (game.mode === "fight") {
          game.fightTime += dt;
          updateBoss(dt);
        } else if (game.mode === "winAnim" || game.mode === "loseAnim") {
          updateBoss(dt);
          if (game.mode === "loseAnim" && game.modeT > 2.3) endScreen(false);
        } else {
          updateBoss(dt);
        }
        L.ambient(dt);
        updateParticles(dt);
        updateFx(dt);
      }

      const overlay = document.getElementById("overlay"),
        titlePanel = document.getElementById("titlePanel"),
        endPanel = document.getElementById("endPanel");
      const $ = (id) => document.getElementById(id);
      function showOverlay(which) {
        overlay.hidden = false;
        titlePanel.hidden = which !== "title";
        endPanel.hidden = which === "title";
      }
      function startFight(idx = levelIdx) {
        levelIdx = idx;
        L = LEVELS[idx];
        audioOn();
        if (document.activeElement && document.activeElement.blur)
          document.activeElement.blur();
        Object.assign(player, {
          hp: CFG.hearts,
          lock: 0,
          buffer: null,
          shieldMode: null,
          shieldT: 9,
          swingT: -1,
          recoilT: -1,
          hurtT: -1,
        });
        silence(boss.channelSnd);
        Object.assign(boss, {
          state: "idle",
          t: 0,
          move: null,
          moveKey: null,
          idleDur: 9,
          hits: 0,
          last: [],
          forced: null,
          queue: [],
          chain: null,
          comboPending: false,
          lastWasCombo: false,
          flash: 0,
          flinch: 0,
          exploded: false,
          raged: false,
          feint: false,
          glinted: false,
          fromG: null,
          followDur: 0,
          disarmed: false,
          helmOff: false,
          openHits: 0,
          holdAt: null,
          weakT: 0,
          n: 0,
          channelSnd: null,
          crumbled: false,
          crumbleT: 0,
        });
        Object.assign(KN, { next: rand(5, 9), bolt: 0 });
        Object.assign(stats, { parries: 0, hits: 0, taken: 0 });
        for (const h of hearts) h.breakT = null;
        parts = [];
        fx = [];
        lastPose = null;
        Object.assign(game, {
          mode: "intro",
          modeT: 0,
          fightTime: 0,
          roared: false,
          hitstop: 0,
          cine: null,
          impactT: 0,
          star: null,
          slowT: 0,
          punchT: 0,
        });
        overlay.hidden = true;
        L.shout(0.35);
      }
      let endAction = () => startFight(0);
      function endScreen(won) {
        game.mode = won ? "win" : "lose";
        game.modeT = 0;
        const t = R(game.fightTime),
          next = won && levelIdx + 1 < LEVELS.length;
        if (next) {
          unlocked = Math.max(unlocked, levelIdx + 2);
          store.set("dragonDuelUnlocked", String(unlocked));
          showLevelButtons();
        }
        $("endEyebrow").textContent = won ? L.winText : L.loseText;
        $("endTitle").textContent = won ? "Victory" : "You fell";
        $("endTitle").className = won ? "" : "lose";
        $("stTime").textContent =
          `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
        $("stParries").textContent = stats.parries;
        $("stTaken").textContent = stats.taken;
        $("stRankBox").hidden = !won;
        $("stRank").textContent =
          player.hp >= 5
            ? "S"
            : player.hp === 4
              ? "A"
              : player.hp >= 2
                ? "B"
                : "C";
        $("againBtn").textContent = next
          ? "Next duel"
          : won
            ? "Play again"
            : "Fight again";
        $("endHint").textContent = won ? "or press Enter" : "or press R";
        const replay = levelIdx;
        endAction = next
          ? () => startFight(replay + 1)
          : won
            ? () => startFight(0)
            : () => startFight(replay);
        showOverlay("end");
        won ? sfx.win() : sfx.lose();
      }

      /* ================= Input ================= */
      const btnParry = $("btnParry"),
        btnAttack = $("btnAttack"),
        muteBtn = $("muteBtn");
      const PARRY_KEYS = new Set(["ArrowLeft", "KeyA", "KeyJ", "KeyZ"]);
      const ATTACK_KEYS = new Set(["ArrowRight", "KeyD", "KeyK", "KeyX"]);
      function press(btn) {
        btn.classList.add("down");
        setTimeout(() => btn.classList.remove("down"), 110);
      }
      function toggleMute() {
        muted = !muted;
        if (master) master.gain.value = muted ? 0 : 0.5;
        muteBtn.textContent = muted ? "Sound off" : "Sound on";
        muteBtn.setAttribute("aria-pressed", String(muted));
      }
      addEventListener("keydown", (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const k = e.code;
        const ours =
          PARRY_KEYS.has(k) ||
          ATTACK_KEYS.has(k) ||
          k === "Space" ||
          k === "Enter" ||
          k === "KeyR" ||
          k.startsWith("Arrow");
        if (ours) e.preventDefault();
        if (e.repeat) return;
        if (k === "KeyM") {
          toggleMute();
          return;
        }
        audioOn();
        if (game.mode === "title") {
          if (ours) startFight(0);
          return;
        }
        if (game.mode === "win" || game.mode === "lose") {
          if (game.modeT < 0.5) return;
          if (k === "KeyR") startFight(levelIdx);
          else if (k === "Enter" || k === "Space") endAction();
          return;
        }
        if (PARRY_KEYS.has(k)) {
          press(btnParry);
          act("parry");
        } else if (ATTACK_KEYS.has(k)) {
          press(btnAttack);
          act("attack");
        }
      });
      for (const [btn, a] of [
        [btnParry, "parry"],
        [btnAttack, "attack"],
      ]) {
        btn.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          audioOn();
          press(btn);
          if (game.mode === "title") startFight(0);
          else act(a);
        });
        btn.addEventListener("contextmenu", (e) => e.preventDefault());
      }
      const lvl2Btn = $("lvl2Btn"),
        lvl3Btn = $("lvl3Btn"),
        lvl4Btn = $("lvl4Btn");
      function showLevelButtons() {
        lvl2Btn.hidden = unlocked < 2;
        lvl3Btn.hidden = unlocked < 3;
        lvl4Btn.hidden = unlocked < 4;
      }
      showLevelButtons();
      $("startBtn").addEventListener("click", () => startFight(0));
      lvl2Btn.addEventListener("click", () => startFight(1));
      lvl3Btn.addEventListener("click", () => startFight(2));
      lvl4Btn.addEventListener("click", () => startFight(3));
      $("againBtn").addEventListener("click", () => endAction());
      muteBtn.addEventListener("click", () => {
        audioOn();
        toggleMute();
      });

      /* ================= Sizing + loop ================= */
      const stage = $("stage"),
        frameEl = $("frame"),
        barTop = $("barTop"),
        barBot = $("barBot");
      let scale = 2;
      function fit() {
        const r = stage.getBoundingClientRect();
        let s = Math.min(r.width / W, r.height / H);
        const si = Math.floor(s);
        if (si >= 2 && si / s > 0.86) s = si;
        scale = Math.max(0.5, s);
        frameEl.style.width = W * scale + "px";
        frameEl.style.height = H * scale + "px";
      }
      new ResizeObserver(fit).observe(stage);
      fit();

      buildBackground();
      buildSamuraiBackground();
      buildKnightBackground();
      buildLichBackground();
      let last = performance.now();
      // one tick of wall-clock time: realtime effects, then hitstop or the (possibly slowed) game update
      function step(rdt) {
        game.realTime += rdt;
        shakeT = Math.max(0, shakeT - rdt);
        tickRealtime(rdt);
        if (game.hitstop > 0) game.hitstop -= rdt;
        else update(rdt * timeScale());
      }
      function frame(now) {
        // the first rAF timestamp can predate performance.now() at boot; never let time run backwards
        step(clamp((now - last) / 1000, 0, 0.05));
        last = now;
        render();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
