<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>I Parry Everything</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Silkscreen:wght@400;700&family=VT323&display=swap"
    />
    <style>
      /* Layout: one screen. The pixel stage scales to fit; a stone ledge below holds the two fight buttons. */
      :root {
        --night: #0d0a18;
        --veil: rgba(10, 7, 20, 0.8);
        --stone: #1f1932;
        --stone-hi: #3b3058;
        --shade: rgba(0, 0, 0, 0.45);
        --bone: #efe4c8;
        --bone-dim: #a99db9;
        --ember: #ff8a2a;
        --ember-deep: #8a1f18;
        --blood: #e8454f;
        --steel: #aebfe0;
        --letterbox: #000000;
        --font-display: "Jacquard 24", "Old English Text MT", serif;
        --font-ui: "Silkscreen", "Courier New", monospace;
        --font-body: "VT323", "Courier New", monospace;
        color-scheme: dark;
      }
      [hidden] {
        display: none !important;
      }
      html {
        height: 100%;
        box-sizing: border-box;
        background: var(--night);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        height: 100%;
        margin: 0;
        background: var(--night);
        color: var(--bone);
        font-family: var(--font-body);
        font-size: 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 12px;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
      }
      #frame {
        position: relative;
        width: 512px;
        height: 448px;
        overflow: hidden;
        outline: 2px solid var(--stone-hi);
        outline-offset: 2px;
      }
      .lbar {
        position: absolute;
        left: 0;
        right: 0;
        height: 0;
        background: var(--letterbox);
        pointer-events: none;
      }
      #barTop {
        top: 0;
      }
      #barBot {
        bottom: 0;
      }
      #screen {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
      }

      .mute {
        position: absolute;
        top: 0;
        right: 0;
        font-family: var(--font-ui);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--bone-dim);
        background: var(--stone);
        border: 0;
        box-shadow: inset 0 0 0 2px var(--stone-hi);
        padding: 6px 10px;
        cursor: pointer;
        z-index: 3;
      }
      .mute:focus-visible,
      .btn:focus-visible,
      .cta:focus-visible {
        outline: 2px solid var(--bone);
        outline-offset: 2px;
      }

      #overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        background: var(--veil);
        overflow: auto;
        padding-block: 16px;
      }
      .panel {
        width: min(31rem, 100%);
        display: grid;
        gap: 14px;
        justify-items: start;
      }
      .eyebrow {
        margin: 0;
        font-family: var(--font-ui);
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--bone-dim);
      }
      h1,
      h2 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 400;
        line-height: 0.85;
        color: var(--ember);
        text-shadow: 4px 4px 0 var(--ember-deep);
        text-wrap: balance;
      }
      h1 {
        font-size: clamp(60px, 15vw, 112px);
      }
      h2 {
        font-size: clamp(56px, 13vw, 96px);
      }
      h2.lose {
        color: var(--blood);
      }
      #titlePanel {
        justify-items: center;
        text-align: center;
        gap: 22px;
      }
      .keys {
        margin: 0;
        font-size: 19px;
        color: var(--bone-dim);
        line-height: 1.6;
      }
      kbd {
        display: inline-block;
        min-width: 1.6em;
        padding: 0 5px;
        margin-right: 2px;
        font-family: var(--font-ui);
        font-size: 12px;
        line-height: 20px;
        text-align: center;
        color: var(--bone);
        background: var(--stone);
        box-shadow:
          inset 0 -2px 0 var(--shade),
          inset 0 0 0 1px var(--stone-hi);
      }
      .cta {
        font-family: var(--font-ui);
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--night);
        background: var(--ember);
        border: 0;
        padding: 12px 22px;
        cursor: pointer;
        box-shadow: inset 0 -4px 0 var(--ember-deep);
        clip-path: polygon(
          4px 0,
          calc(100% - 4px) 0,
          100% 4px,
          100% calc(100% - 4px),
          calc(100% - 4px) 100%,
          4px 100%,
          0 calc(100% - 4px),
          0 4px
        );
      }
      .cta:active {
        transform: translateY(2px);
        box-shadow: inset 0 -2px 0 var(--ember-deep);
      }
      .cta.ghost {
        color: var(--ember);
        background: transparent;
        box-shadow: inset 0 0 0 2px var(--ember);
      }
      .title-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      .fine {
        margin: 0;
        font-size: 17px;
        color: var(--bone-dim);
      }
      .stats {
        margin: 0;
        display: grid;
        grid-template-columns: repeat(4, auto);
        gap: 8px 22px;
      }
      .stats div {
        display: grid;
        gap: 2px;
      }
      .stats dt {
        font-family: var(--font-ui);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--bone-dim);
      }
      .stats dd {
        margin: 0;
        font-size: 30px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      @media (max-width: 420px) {
        .stats {
          grid-template-columns: repeat(2, auto);
        }
      }

      #controls {
        display: flex;
        gap: 12px;
        justify-content: center;
        padding-top: 14px;
      }
      .btn {
        flex: 1 1 0;
        max-width: 240px;
        min-height: 68px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-family: var(--font-ui);
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--btn-accent);
        background: var(--stone);
        border: 0;
        cursor: pointer;
        box-shadow:
          inset 0 -5px 0 var(--shade),
          inset 0 0 0 2px var(--stone-hi);
        clip-path: polygon(
          6px 0,
          calc(100% - 6px) 0,
          100% 6px,
          100% calc(100% - 6px),
          calc(100% - 6px) 100%,
          6px 100%,
          0 calc(100% - 6px),
          0 6px
        );
        touch-action: none;
      }
      .btn.parry {
        --btn-accent: var(--steel);
      }
      .btn.attack {
        --btn-accent: var(--ember);
      }
      .btn small {
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 17px;
        letter-spacing: 0.04em;
        text-transform: none;
        color: var(--bone-dim);
      }
      .btn.down {
        transform: translateY(3px);
        box-shadow:
          inset 0 -2px 0 var(--shade),
          inset 0 0 0 2px var(--btn-accent);
      }
      @media (hover: none) {
        .btn small,
        .keys {
          display: none;
        }
        .btn {
          min-height: 76px;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="frame">
        <canvas
          id="screen"
          width="256"
          height="224"
          aria-label="I Parry Everything: first-person view of the duel"
        ></canvas>
        <div class="lbar" id="barTop"></div>
        <div class="lbar" id="barBot"></div>
      </div>
      <button id="muteBtn" class="mute" type="button" aria-pressed="false">
        Sound on
      </button>
      <div id="overlay">
        <div class="panel" id="titlePanel">
          <h1>I Parry Everything</h1>
          <div class="title-actions">
            <button class="cta" id="startBtn" type="button">Fight</button>
            <button class="cta ghost" id="lvl2Btn" type="button" hidden>
              Level 2
            </button>
            <button class="cta ghost" id="lvl3Btn" type="button" hidden>
              Level 3
            </button>
            <button class="cta ghost" id="lvl4Btn" type="button" hidden>
              Level 4
            </button>
          </div>
        </div>
        <div class="panel" id="endPanel" hidden>
          <p class="eyebrow" id="endEyebrow">The dragon is slain</p>
          <h2 id="endTitle">Victory</h2>
          <dl class="stats">
            <div>
              <dt>Time</dt>
              <dd id="stTime">0:00</dd>
            </div>
            <div>
              <dt>Parries</dt>
              <dd id="stParries">0</dd>
            </div>
            <div>
              <dt>Hearts lost</dt>
              <dd id="stTaken">0</dd>
            </div>
            <div id="stRankBox">
              <dt>Rank</dt>
              <dd id="stRank">S</dd>
            </div>
          </dl>
          <button class="cta" id="againBtn" type="button">Fight again</button>
          <p class="fine" id="endHint">or press R</p>
        </div>
      </div>
    </div>
    <div id="controls">
      <button id="btnParry" class="btn parry" type="button">◄ Parry</button>
      <button id="btnAttack" class="btn attack" type="button">Attack ►</button>
    </div>

    <script>
      "use strict";

      /* ================= Tuning: tweak the fight here ================= */
      const CFG = {
        hearts: 5,
        bossHits: 20, // sword hits to slay the boss (never shown to the player)
        rageAt: 12, // after this many hits it roars, speeds up and opens with its combo
        rageSpeed: 0.85, // telegraph length multiplier while enraged
        doubleClaw: 0.4, // chance a claw is followed straight away by a second one
        rageComboChance: 0.3, // once enraged, chance an attack is the rage combo (the first one always is)
        comboStun: 1.6, // time to hit back after parrying the combo's final strike
        chainFollow: 0.4, // when a chained strike hits you, the next one comes after this pause
        feint: 0.3, // samurai: chance an attack is a feint
        feintRage: 0.5, //          ...once he's enraged
        feintHitch: 0.22, //          how long the fake commit lasts before he switches attacks
        guardTime: 0.7, // knight: after 3 hits in an opening his guard is up this long; swing into it and he parries you
        counteredLock: 0.7, //         how long you're staggered when he parries you
        riposte: 0.12, //         his answer's windup: short enough that it lands before your stagger ends
        openWindow: 0.55, //         in his rage exchange, how long he's open for your swing before he shield-bashes
        attackCooldown: 0.3, // seconds between sword swings
        whiffLock: 0.4, // parried at nothing: shield stays down this long
        blockedLock: 0.5, // swung while the boss was guarding
        hurtLock: 0.45,
        idle: [0.8, 1.6], // pause between attacks, seconds
        idleRage: [0.45, 1.0],
      };
      // windup = telegraph length, window = parry window (the strike itself),
      // stun = how long it stays open to your sword after a parry, follow = recovery after it hits you
      const MOVES = {
        claw: { dmg: 1, windup: 0.55, window: 0.18, stun: 0.55, follow: 0.45 },
        tail: { dmg: 3, windup: 1.35, window: 0.3, stun: 0.9, follow: 0.6 },
        fire: {
          dmg: 2,
          windup: [1.0, 1.8],
          window: 0.22,
          stun: 1.15,
          follow: 0.7,
        },
      };
      // inside a chain (double claw, rage combo) the tells are shorter, and a parry only buys a short deflect before the next strike
      const CHAIN_WINDUP = { claw: 0.34, tail: 0.75, fire: [0.6, 0.85] };
      const DEFLECT = { claw: 0.16, tail: 0.3, fire: 0.3 };
      // rage combo: fireball, double swipe, tail sweep, double swipe, fireball. Only the last parry opens it up.
      const RAGE_COMBO = [
        "fire",
        "claw",
        "claw",
        "tail",
        "claw",
        "claw",
        "fire",
      ];
      // level 2. Real attacks flash and ting just before they swing; a feint has the same windup but no flash,
      // fakes the commit, then switches to another attack (feintInto)
      const SAMURAI_MOVES = {
        slash: { dmg: 1, windup: 0.5, window: 0.16, stun: 0.55, follow: 0.45 },
        cleave: { dmg: 3, windup: 1.2, window: 0.26, stun: 0.9, follow: 0.6 },
        thrust: {
          dmg: 2,
          windup: [0.8, 1.5],
          window: 0.2,
          stun: 1.1,
          follow: 0.6,
        },
      };
      const SAMURAI_CHAIN = { slash: 0.4, cleave: 0.5, thrust: [0.45, 0.6] };
      const SAMURAI_DEFLECT = { slash: 0.2, cleave: 0.25, thrust: 0.22 };
      // his rage combo. side -1 = the blade comes from your left. A feint step flows straight into the next step.
      const SAMURAI_COMBO = [
        { key: "cleave", feint: true },
        { key: "slash", side: -1 },
        { key: "cleave", feint: true },
        { key: "slash", side: 1 },
        { key: "cleave" },
        { key: "cleave", feint: true },
        { key: "thrust" },
        { key: "thrust" },
        { key: "cleave" },
      ];
      // level 3. Smite hangs mid-swing for a random beat; bash only comes when you don't take an opening, and can't be parried
      const KNIGHT_MOVES = {
        cut: { dmg: 1, windup: 0.45, window: 0.17, stun: 1.0, follow: 0.4 },
        smite: {
          dmg: 3,
          windup: 0.85,
          window: 0.26,
          stun: 1.5,
          follow: 0.6,
          hold: [0.15, 0.7],
        },
        lunge: {
          dmg: 2,
          windup: [0.7, 1.2],
          window: 0.2,
          stun: 1.3,
          follow: 0.6,
        },
        bash: {
          dmg: 1,
          windup: 0.18,
          window: 0.12,
          stun: 0,
          follow: 0.5,
          unparryable: true,
        },
      };
      const KNIGHT_CHAIN = {
        cut: 0.42,
        smite: 0.5,
        lunge: [0.5, 0.7],
        bash: 0.18,
      };
      const KNIGHT_DEFLECT = { cut: 0.2, smite: 0.25, lunge: 0.22, bash: 0.2 };
      // his rage combo is an exchange: each { open } is a beat where you must swing, he parries you, then strikes again
      const KNIGHT_COMBO = [
        { key: "smite" },
        { open: true },
        { key: "cut", side: -1 },
        { open: true },
        { key: "lunge" },
        { open: true },
        { key: "cut", side: 1 },
        { open: true },
        { key: "smite" },
      ];
      // level 4. Orbs come in volleys, each at its own pitch. The curse is a channel: parrying does nothing,
      // you have to hit him while he chants. Doom, the giant orb, only ends his rage combo.
      const LICH_MOVES = {
        orb: {
          dmg: 1,
          windup: [0.65, 0.9],
          window: 0.18,
          stun: 0.9,
          follow: 0.45,
        },
        spear: {
          dmg: 3,
          windup: [1.0, 1.5],
          window: 0.24,
          stun: 1.2,
          follow: 0.6,
        },
        curse: {
          dmg: 2,
          windup: [1.5, 1.9],
          window: 0.12,
          stun: 1.4,
          follow: 0.7,
          unparryable: true,
          channel: true,
        },
        doom: { dmg: 3, windup: 1.4, window: 0.28, stun: 1.6, follow: 0.7 },
      };
      const LICH_CHAIN = {
        orb: [0.28, 0.5],
        spear: 0.75,
        curse: [1.1, 1.3],
        doom: 1.25,
      };
      const LICH_DEFLECT = { orb: 0.16, spear: 0.3, curse: 0.45, doom: 0.3 };
      // his rage combo makes you switch buttons: parry the volleys and the spear, hit him through each curse
      const LICH_COMBO = [
        { key: "orb", n: 0, windup: 0.6, side: -1 },
        { key: "orb", n: 1, side: 1 },
        { key: "orb", n: 2, side: -1 },
        { key: "curse" },
        { key: "spear", side: 1 },
        { key: "orb", n: 0, windup: 0.55, side: 1 },
        { key: "orb", n: 1, side: -1 },
        { key: "orb", n: 2, side: 1 },
        { key: "curse" },
        { key: "doom" },
      ];

      /* ================= Setup ================= */
      const W = 256,
        H = 224,
        TAU = Math.PI * 2;
      const cvs = document.getElementById("screen");
      const ctx = cvs.getContext("2d");
      const layer = document.createElement("canvas");
      layer.width = W;
      layer.height = H;
      const lctx = layer.getContext("2d", { willReadFrequently: true });
      const bgc = document.createElement("canvas");
      bgc.width = W;
      bgc.height = H;
      const bctx = bgc.getContext("2d");
      const vig = document.createElement("canvas");
      vig.width = W;
      vig.height = H;
      const reduceMotion = matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;

      const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
      const lerp = (a, b, t) => a + (b - a) * t;
      const easeOut = (t) => 1 - (1 - t) ** 3;
      const smooth = (a, b, t) => {
        t = clamp((t - a) / (b - a), 0, 1);
        return t * t * (3 - 2 * t);
      };
      const rand = (a, b) => a + Math.random() * (b - a);
      const R = Math.round;
      const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

      function pack(hex) {
        const n = parseInt(hex.slice(1), 16);
        return (
          ((255 << 24) |
            ((n & 255) << 16) |
            (((n >> 8) & 255) << 8) |
            ((n >> 16) & 255)) >>>
          0
        );
      }
      function mix(a, b, t) {
        const A = parseInt(a.slice(1), 16),
          B = parseInt(b.slice(1), 16);
        const ch = (s) =>
          R(((A >> s) & 255) + (((B >> s) & 255) - ((A >> s) & 255)) * t);
        return (
          "#" +
          ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0))
            .toString(16)
            .slice(1)
        );
      }
      function mulberry32(a) {
        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      /* ================= Pixel primitives (whole-pixel fillRects, no anti-aliasing) ================= */
      let g = ctx;
      function rect(x, y, w, h, c) {
        g.fillStyle = c;
        g.fillRect(R(x), R(y), R(w), R(h));
      }
      function ell(cx, cy, rx, ry, c) {
        g.fillStyle = c;
        cx = R(cx);
        cy = R(cy);
        if (rx < 0.5 || ry < 0.5) {
          g.fillRect(cx, cy, 1, 1);
          return;
        }
        const RX = rx + 0.5,
          RY = ry + 0.5,
          n = Math.floor(RY);
        for (let dy = -n; dy <= n; dy++) {
          const t = 1 - (dy * dy) / (RY * RY);
          if (t < 0) continue;
          const hw = Math.floor(RX * Math.sqrt(t));
          g.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1);
        }
      }
      function circ(cx, cy, r, c) {
        ell(cx, cy, r, r, c);
      }
      const xs = [];
      function poly(p, c) {
        g.fillStyle = c;
        const n = p.length;
        let y0 = Infinity,
          y1 = -Infinity;
        for (let i = 1; i < n; i += 2) {
          if (p[i] < y0) y0 = p[i];
          if (p[i] > y1) y1 = p[i];
        }
        y0 = Math.max(0, Math.floor(y0));
        y1 = Math.min(H - 1, Math.ceil(y1));
        for (let y = y0; y <= y1; y++) {
          const sy = y + 0.5;
          xs.length = 0;
          for (let i = 0; i < n; i += 2) {
            const ax = p[i],
              ay = p[i + 1],
              j = (i + 2) % n,
              bx = p[j],
              by = p[j + 1];
            if ((ay <= sy && by > sy) || (by <= sy && ay > sy))
              xs.push(ax + ((sy - ay) * (bx - ax)) / (by - ay));
          }
          xs.sort((a, b) => a - b);
          for (let k = 0; k + 1 < xs.length; k += 2) {
            const a = R(xs[k]),
              b = R(xs[k + 1]);
            if (b > a) g.fillRect(a, y, b - a, 1);
          }
        }
      }
      function limb(x1, y1, r1, x2, y2, r2, c) {
        const dx = x2 - x1,
          dy = y2 - y1,
          L = Math.hypot(dx, dy) || 1,
          nx = -dy / L,
          ny = dx / L;
        poly(
          [
            x1 + nx * r1,
            y1 + ny * r1,
            x2 + nx * r2,
            y2 + ny * r2,
            x2 - nx * r2,
            y2 - ny * r2,
            x1 - nx * r1,
            y1 - ny * r1,
          ],
          c,
        );
        circ(x1, y1, r1, c);
        circ(x2, y2, r2, c);
      }
      function chain(pts, c) {
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i],
            b = pts[i + 1];
          limb(a[0], a[1], a[2], b[0], b[1], b[2], c);
        }
      }
      function line(x0, y0, x1, y1, c) {
        g.fillStyle = c;
        x0 = R(x0);
        y0 = R(y0);
        x1 = R(x1);
        y1 = R(y1);
        const dx = Math.abs(x1 - x0),
          dy = -Math.abs(y1 - y0),
          sx = x0 < x1 ? 1 : -1,
          sy = y0 < y1 ? 1 : -1;
        let e = dx + dy;
        for (let guard = 0; guard < 1024; guard++) {
          g.fillRect(x0, y0, 1, 1);
          if (x0 === x1 && y0 === y1) break;
          const e2 = 2 * e;
          if (e2 >= dy) {
            e += dy;
            x0 += sx;
          }
          if (e2 <= dx) {
            e += dx;
            y0 += sy;
          }
        }
      }
      function ring(cx, cy, r, w, c) {
        g.fillStyle = c;
        cx = R(cx);
        cy = R(cy);
        const ri = Math.max(0, r - w),
          n = Math.ceil(r);
        for (let dy = -n; dy <= n; dy++) {
          const o = r * r - dy * dy;
          if (o < 0) continue;
          const wo = Math.floor(Math.sqrt(o)),
            q = ri * ri - dy * dy,
            wi = q > 0 ? Math.floor(Math.sqrt(q)) : -1;
          if (wi < 0) g.fillRect(cx - wo, cy + dy, wo * 2 + 1, 1);
          else {
            g.fillRect(cx - wo, cy + dy, wo - wi, 1);
            g.fillRect(cx + wi + 1, cy + dy, wo - wi, 1);
          }
        }
      }
      function starburst(x, y, s) {
        const outer = [],
          inner = [];
        for (let i = 0; i < 20; i++) {
          const a = (i / 20) * TAU + 0.2,
            r = i % 2 ? s * 0.3 : s * (0.7 + (0.3 * ((i * 7) % 5)) / 4);
          outer.push(x + Math.cos(a) * r, y + Math.sin(a) * r);
          inner.push(x + Math.cos(a) * r * 0.6, y + Math.sin(a) * r * 0.6);
        }
        poly(outer, "#aebfe0");
        poly(inner, "#ffffff");
      }
      function star(x, y, r, c1, c2) {
        rect(x - r, y, r * 2 + 1, 1, c1);
        rect(x, y - r, 1, r * 2 + 1, c1);
        if (r > 1) {

      function spade(x, y, dx, dy, s, c1, c2) {
        const L = Math.hypot(dx, dy) || 1;

            x - dx * s * 0.3,
            y - dy * s * 0.3,
            x + nx * s + dx * s * 0.2,
            y + ny * s + dy * s * 0.2,
            tip[0],
            tip[1],
            x - nx * s + dx * s * 0.2,
            y - ny * s + dy * s * 0.2,

          c1,
        );
        poly(
          [
            x - dx * s * 0.2,
            y - dy * s * 0.2,
            x + nx * s * 0.7 + dx * s * 0.2,
            y + ny * s * 0.7 + dy * s * 0.2,
            tip[0],
            tip[1],
          ],
          c2,
        );
      }

      /* ================= Dragon drawing ================= */
      const SCARS = [

          F2 = [X(116), 62 - 12 * f],
          F3 = [X(100), 98 - 4 * f],
          F4 = [X(72), 120 + by * 0.5],
          B = [X(30), 138 + by];
        const sc = (a, b, k = 0.28) => [
          lerp((a[0] + b[0]) / 2, Wr[0], k),
          lerp((a[1] + b[1]) / 2, Wr[1], k),
        ];
        poly([...Wr, ...F1, ...sc(F1, F2), ...F2], C.w2);
        poly([...Wr, ...F2, ...sc(F2, F3), ...F3], C.w1);
        poly([...Wr, ...F3, ...sc(F3, F4), ...F4], C.w2);
        poly([...Wr, ...F4, ...sc(F4, B, 0.15), ...B, ...S], C.w1);
        limb(S[0], S[1], 4.5, Wr[0], Wr[1], 3.5, C.d1);
        limb(S[0], S[1] - 1, 2.5, Wr[0], Wr[1] - 1, 2, C.d2);

          limb(Wr[0], Wr[1], 2.2, F[0], F[1], 0.6, C.d0);

          [

      function tailPts(p) {
        const cx = 128 + p.bx,
          T = game.time,
          w = Math.sin(T * 2.3);
        const rest = [
          [cx + 24, 170, 10],
          [cx + 50, 183, 8],
          [cx + 76, 188, 6],
          [cx + 96, 181, 4.5],
          [cx + 106 + w * 2, 168 + w * 2, 3],
        ];
        if (p.tail !== "raised") return rest;
        const e = p.tailP,
          sh = p.tailShake * 3;
        const up = [
          [cx + 26, 164, 10],
          [cx + 56, 148, 8],
          [cx + 82, 122, 6],
          [cx + 94, 96, 4.5],
          [cx + 100, 74, 3],
        ];
        return rest.map((r, i) => [
          lerp(r[0], up[i][0], e) + Math.sin(T * 41 + i * 1.7) * sh * (i / 4),
          lerp(r[1], up[i][1], e) + Math.cos(T * 37 + i) * sh * 0.5 * (i / 4),
          r[2],

      function drawTail(p) {

          const [x, y, r] = pts[i];

      function drawNeck(p, hx, hy) {

      function drawHead(p, hx, hy) {
        const s = p.hs,

        const one = (a, c) => poly(T(a, 1), c);

          p.glow > 0 ? mix(C.mouth, C.f2, Math.min(1, p.glow * 1.3)) : C.mouth;

            [-12, 26, 12, 26, 10, 27 + jo, -10, 27 + jo],

          ell(
            hx,
            hy + (27 + jo * 0.6) * s,
            6 * s,
            2.5 * s,
            p.mouthFlash ? "#ffffff" : C.f1,

        one([-13, 25 + jo, 13, 25 + jo, 9, 36 + jo, -9, 36 + jo], C.d1);
        one([-10, 27 + jo, 10, 27 + jo, 7, 33 + jo, -7, 33 + jo], C.d2);
        if (jo > 3) {
          both([-10, 26 + jo, -7, 26 + jo, -8.5, 22 + jo], C.fang);
          both([-4, 26 + jo, -2, 26 + jo, -3, 23 + jo], C.fang);
        }
        both([-8, 34 + jo, -12, 41 + jo, -4, 36 + jo], C.h1);
        if (p.tongue && jo > 2)
          limb(
            hx + 2 * s,
            hy + (27 + jo * 0.5) * s,

        // skull

        // brows and eyes
        both([-24, -5, -5, 1, -5, 4, -24, -1], C.d0);
        const ec =

      function drawHand(x, y, s, ang, m) {
        const c = Math.cos(ang),
          sn = Math.sin(ang);
        const L = (lx, ly) => [
          x + (lx * c - ly * sn) * s,
          y + (lx * sn + ly * c) * s,
        ];
        const len = 1 + (s - 1) * 0.2; // talons grow faster than the palm as the claw nears
        ell(x, y, 7 * s + 1, 5.5 * s + 1, C.out);
        ell(x, y, 7 * s, 5.5 * s, C.d1);
        ell(x - s, y - s, 4.5 * s, 3 * s, C.d2);
        for (const [bx, by] of [
          [-5, 2],
          [0, 3.5],
          [5, 2],
        ]) {
          const outer = [],
            inner = [];
          for (const [lx, ly] of [
            [-2.3, -0.5],
            [2.3, -0.5],
            [1.8, 5 * len],
            [0.4, 11 * len],
            [-1.1, 6 * len],
          ])
            outer.push(...L(bx + lx * m, by + ly));
          for (const [lx, ly] of [
            [-1.1, 0],
            [0.7, 0],
            [0.2, 8 * len],
          ])
            inner.push(...L(bx + lx * m, by + ly));
          poly(outer, C.out);
          poly(
            outer.map((v, i) => (i % 2 ? v - 0.5 : v)),
            C.h1,
          );
          poly(inner, C.h2);
        }
      }
      function drawArm(a) {

        limb(a.ex, a.ey, 7 * ke, a.hx, a.hy, 6 * k, C.out);
        limb(a.ex, a.ey, 6 * ke, a.hx, a.hy, 5 * k, C.d1);
        limb(a.ex + 1, a.ey - 1, 4 * ke, a.hx + 1, a.hy - 1, 3 * k, C.d2);

      function samuraiBackdrop() {

      function samuraiAmbient(dt) {

      // lamellar panel: plate rows with red silk lacing
      function plates(xl0, xr0, xl1, xr1, y0, y1, step, base) {
        poly([xl0, y0, xr0, y0, xr1, y1, xl1, y1], base);
        for (let y = y0; y < y1 - 2; y += step) {
          const k = (y - y0) / (y1 - y0),
            a = lerp(xl0, xl1, k),
            b = lerp(xr0, xr1, k);
          if (y > y0) {
            rect(a, y, b - a, 1, K.l0);
            rect(a, y + 1, b - a, 1, K.l3);
          }
          for (let x = a + 2; x < b - 1; x += 4)
            rect(x, y + 2, 1, step - 3, K.lace);
        }
      }
      function sode(sx, sy, s, lift) {
        const a = -s * lift * 0.6,
          c = Math.cos(a),
          sn = Math.sin(a);
        const P = (x, y) => [sx + s * x * c - y * sn, sy + s * x * sn + y * c];
        poly([...P(0, 0), ...P(22, 4), ...P(26, 42), ...P(4, 38)], K.l1);
        for (let y = 0; y < 38; y += 6) {
          if (y > 0) {
            const q0 = P(y * 0.105, y),
              q1 = P(22 + y * 0.105, y + 4);
            line(q0[0], q0[1], q1[0], q1[1], K.l0);
          }
          for (let x = 4; x < 21; x += 4) {
            const q = P(x + y * 0.105, y + 2 + x * 0.18);
            rect(q[0], q[1], 1, 3, K.lace);
          }
        }
        const t0 = P(0, 0),
          t1 = P(22, 4);
        line(t0[0], t0[1], t1[0], t1[1], K.au1);
      }
      function samArm(sx, sy, hx, hy, s, lift) {
        // elbows swing wide as the hands go overhead
        const ex = lerp((sx + hx) / 2 + s * 10, sx + s * 20, lift),
          ey = lerp((sy + hy) / 2 + 6, sy - 18, lift);
        limb(sx, sy, 8, ex, ey, 7, C.out);
        limb(ex, ey, 7, hx, hy, 6, C.out);
        limb(sx, sy, 7, ex, ey, 6, K.l1);
        limb(ex, ey, 6, hx, hy, 5, K.l1);
        limb(sx + 1, sy - 1, 4, ex + 1, ey - 1, 3, K.l2);
        limb(ex + 1, ey - 1, 3, hx, hy - 1, 2.5, K.l2);
      }
      function gauntlet(x, y) {
        circ(x, y, 5, C.out);
        circ(x, y, 4.5, K.l2);
        rect(x - 2, y - 3, 3, 1, K.l3);
      }
      function drawNodachi(gx, gy, a, glint, len = 118) {
        const dx = Math.cos(a),
          dy = Math.sin(a),
          nx = -dy,
          ny = dx;
        const C2 = (t) => [
          gx + dx * t * len + nx * 3 * t * t,
          gy + dy * t * len + ny * 3 * t * t,
        ]; // centreline with a gentle curve
        limb(
          gx - dx * 2,
          gy - dy * 2,
          2.5,
          gx - dx * 26,
          gy - dy * 26,
          2.5,
          K.tsuka,
        );
        for (let t = 5; t < 25; t += 4) {
          rect(gx - dx * t + nx, gy - dy * t + ny, 1, 1, K.wrap);
          rect(gx - dx * (t + 2) - nx, gy - dy * (t + 2) - ny, 1, 1, K.wrap);
        }
        circ(gx - dx * 27, gy - dy * 27, 2.5, K.au1);
        const edge = [],
          spine = [];
        for (let i = 0; i <= 8; i++) {
          const t = (i / 8) * 0.94,
            [x, y] = C2(t),
            w = 2.4 - t * 0.9;
          edge.push(x + nx * w, y + ny * w);
          spine.unshift(x - nx * w, y - ny * w);
        }
        const tip = C2(1);
        poly([...edge, tip[0], tip[1], ...spine], K.st0);
        const mid = [];
        for (let i = 8; i >= 0; i--) {
          const [x, y] = C2((i / 8) * 0.94);
          mid.push(x, y);
        }
        poly([...edge, tip[0], tip[1], ...mid], glint ? K.st2 : K.st1);
        for (let i = 0; i < 8; i++) {
          const a0 = C2((i / 8) * 0.94),
            a1 = C2(((i + 1) / 8) * 0.94);
          line(
            a0[0] + nx * 1.5,
            a0[1] + ny * 1.5,
            a1[0] + nx * 1.5,
            a1[1] + ny * 1.5,
            K.st2,
          );
        }
        limb(
          gx + dx * 2,
          gy + dy * 2,
          2.6,
          gx + dx * 6,
          gy + dy * 6,
          2.6,
          K.au1,
        );
        ell(gx, gy, 5, 5, C.out);
        ell(gx, gy, 4.5, 4.5, K.au0);
        ell(gx, gy, 3, 3, K.l0);
        if (glint) {
          // flash on the highest part of the blade that's still on screen
          const s =
            [0.72, 0.5, 0.3, 0.15]
              .map(C2)

      function knightFront(p) {

      function knightPose() {
        const d = boss,
          T = game.time,
          st = d.state,
          mk = d.moveKey,
          mode = game.mode,
          m = d.side;
        const p = {
          bx: 0,
          by: Math.sin(T * 1.8) * 1.2,
          sink: 0,
          hxo: 0,
          hyo: Math.sin(T * 1.8 + 0.4) * 0.8,
          eyes: d.raged ? "flare" : "normal",
          stars: 0,
          big: null,
          sword: "blade",
          weak: 0,
          weakT: d.weakT || 0,
          urgent: 0,
          shieldGone: false,
          helmOff: !!d.helmOff,
        };
        // sword grip [x from centre, y, blade angle] and shield [x from centre, y]
        const GUARD = [-24, 128, -1.35],
          LOW = [-28, 156, 1.95],
          HIGH = [-6, 30, -1.6],
          SG = [30, 116];
        const to = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));
        let G = GUARD,
          S = SG;
        const WIND = {
          cut: m < 0 ? [-42, 84, -2.4] : [34, 80, -0.7],
          smite: HIGH,
          lunge: [-36, 120, -0.15],
          bash: GUARD,
        };
        const SWIND = {
          cut: SG,
          smite: [28, 122],
          lunge: [14, 112],
          bash: [10, 110],
        };
        const strikeG = {
          cut: [m * 58, 72, 0],
          smite: [-2, 118, -1.6],
          lunge: [-20, 130, 0],
          bash: GUARD,
        };
        const roar = (r) => {
          G = to(G, HIGH, r);
          p.by -= 2 * r;
          p.hxo += Math.sin(T * 40) * 0.6 * r;
          if (r > 0.3) p.eyes = "flare";
        };
        const daze = (b) => {
          G = to(G, LOW, b);
          S = to(S, [40, 146], b);
          p.by += 4 * b;
          p.hyo += 6 * b;
          p.hxo += Math.sin(T * 5) * 4 * b;
          p.stars = b;
          if (b > 0.3) p.eyes = "dim";
        };

        if (mode === "intro") {
          const u = game.modeT / 1.9;
          G = to(LOW, GUARD, smooth(0.15, 0.5, u));
          roar(smooth(0.2, 0.35, u) * (1 - smooth(0.6, 0.85, u)));
        } else if (mode === "loseAnim" || mode === "lose")
          roar(smooth(0.5, 0.9, game.modeT));
        else if (st === "rageRoar")
          roar(smooth(0, 0.2, d.t / 1.3) * (1 - smooth(0.8, 1, d.t / 1.3)));
        else if (st === "snarl") {
          G = to(
            GUARD,
            [16, 104, -0.6],
            Math.abs(Math.sin((d.t / 0.5) * Math.PI * 2)),
          );
          S = [22, 112];
          p.eyes = "flare";
        } else if (st === "windup") {
          const t = clamp(d.t / d.windup, 0, 1),
            e = easeOut(clamp(t / 0.6, 0, 1));
          G = to(d.fromG || GUARD, WIND[mk], e);
          S = to(SG, SWIND[mk], e);
          if (mk === "smite" && d.holdAt) {
            // raise, start the chop... then hang there until the real strike
            G = to(
              d.fromG || GUARD,
              HIGH,
              easeOut(clamp(d.t / (d.holdAt * 0.7), 0, 1)),
            );
            if (d.t > d.holdAt * 0.7) {
              const k = clamp((d.t - d.holdAt * 0.7) / (d.holdAt * 0.3), 0, 1);
              p.sword = "none";
              G = to(HIGH, [-4, 48, -1.6], k);
              p.big = {
                type: "smite",
                t:
                  0.32 * easeOut(k) +
                  (d.t > d.holdAt ? Math.sin(T * 30) * 0.004 : 0),
              };
            }
          }
          if (mk === "lunge") {
            p.by += 6 * e;
            p.hyo += 2 * e;
          }
          if (mk === "bash") {
            p.bx = 4 * e;
            p.by += 2 * e;
          }
          if (mk === "cut") p.bx = -m * 4 * e;
          if (t > 0.4) p.eyes = "flare";
        } else if (st === "strike") {
          const t = clamp(d.t / d.move.window, 0, 1);
          p.eyes = "flare";
          p.sword = mk === "bash" ? "blade" : "none";
          if (mk === "cut") {
            G = strikeG.cut;
            p.big = { type: "cut", t: t ** 1.1, m };
          }
          if (mk === "smite") {
            G = strikeG.smite;
            p.by += 4 * t;
            p.big = { type: "smite", t: lerp(0.32, 1, t ** 1.2) };
          }
          if (mk === "lunge") {
            G = strikeG.lunge;
            p.by += 6;
            p.big = { type: "lunge", t };
          }
          if (mk === "bash") {
            p.big = { type: "bash", t };
            p.shieldGone = true;
          }
        } else if (st === "open") {
          // reeling from your parry: sword arm flung wide, chest open
          const k = easeOut(clamp(d.t / 0.15, 0, 1));
          G = to(GUARD, [-62, 96, -2.7], k);
          S = to(SG, [46, 142], k);
          p.by += 3 * k;
          p.hyo += 4 * k;
          p.weak = k;
          p.urgent = clamp(d.t / CFG.openWindow, 0, 1);
        } else if (st === "clash" || st === "guard") {
          const k = easeOut(clamp(d.t / 0.08, 0, 1));
          S = to(SG, [8, 102], k);
          G = to(GUARD, [-38, 98, -2.2], k);
          p.eyes = "flare";
          if (st === "clash")
            p.bx += Math.sin(d.t * 80) * 2 * (1 - clamp(d.t / 0.2, 0, 1));
        } else if (st === "stunned" || st === "deflect") {
          const k = clamp(d.t / 0.2, 0, 1);
          if (k < 1 && mk !== "bash") {
            G = strikeG[mk];
            p.sword = "none";
            p.big =
              mk === "lunge"
                ? {
                    type: "lunge",
                    t: 1 - 0.7 * k,
                    ox: 110 * easeOut(k),
                    oy: -40 * easeOut(k),
                  }
                : { type: mk, t: 1 - easeOut(k), m };
          } else G = to(strikeG[mk], GUARD, smooth(0.2, 0.35, d.t));
          if (st === "stunned") {
            daze(easeOut(clamp((d.t - 0.2) / 0.3, 0, 1)));
            p.weak = clamp(p.weakT / 0.08, 0, 1);
          }
        } else if (st === "recover") {
          daze(1 - easeOut(clamp(d.t / 0.35, 0, 1)));
          p.weak = 1 - clamp(d.t / 0.2, 0, 1);
        } else if (st === "follow") {
          const u = clamp(d.t / d.followDur, 0, 1);
          if (mk === "bash") {
            if (u < 0.3) {
              p.big = { type: "bash", t: 1 + u };
              p.shieldGone = true;
            }
          } else if (u < 0.25) {
            G = strikeG[mk];
            p.sword = "none";
            p.big = {
              type: mk,
              t: 1 + (u / 0.25) * (mk === "lunge" ? 0.5 : 1),
              m,
            };
          } else G = to(strikeG[mk], GUARD, easeOut((u - 0.25) / 0.75));
        } else if (st === "dying") {
          const u = d.t;
          if (u < 0.6) {
            daze(1);
            p.bx += Math.sin(u * 60) * 3 * (1 - u / 0.6);
          } else {
            const k = easeOut(clamp((u - 0.6) / 0.6, 0, 1)),
              c = clamp((u - 1.8) / 1.2, 0, 1);
            G = to(LOW, [-26, 158, 1.62], k);
            S = to([40, 146], [44, 168], k);
            p.by += 22 * k;
            p.hyo += 8 * k;
            p.eyes = "dim";
            p.sink = 130 * c * c;
          }
        }

        if (d.flinch > 0) {
          p.bx += d.flinchDir * 6 * d.flinch;
          p.hxo += d.flinchDir * 3 * d.flinch;
          p.hyo += 2 * d.flinch;
        }
        const cx = 128 + p.bx;
        p.G = G;
        p.S = S;
        p.gx = cx + G[0];
        p.gy = G[1] + p.by;
        p.ga = G[2];
        p.head = [cx + p.hxo, 56 + p.by + p.hyo];
        p.weakAt = [cx + 2, 101 + p.by];
        if (d.helmOff) {
          // knocked off in the finale: it spins away and lands on the floor beside him
          const tau = Math.min(d.helmT || 0, 1),
            [x0, y0] = d.helmFrom;
          p.helm = {
            x: x0 + 70 * tau,
            y: y0 - 228 * tau + 350 * tau * tau,
            a: -10 * (1 - tau) + 1.3,
          };
        }
        return p;
      }

      /* ================= Lich (level 4) ================= */

      function drawSigil(k, flare) {

        for (let i = 0; i < 5; i++) {
          const a = spin + (i * 2 * TAU) / 5;
          pts.push([
            128 + Math.cos(a) * rx * 0.74,

      }
      // the spear's tell: a glowing crack races from his staff's foot toward you; it bursts when it arrives
      function drawGroundCrack(k, s) {
        const x0 = 128 + (lastPose ? lastPose.bx : 0) - 30,
          y0 = 188,
          x1 = PARRY_AT.spear(s)[0],
          y1 = 228,
          n = 10,
          pts = [];
        for (let i = 0; i <= n; i++) {
          const j = i > 0 && i < n ? ((i * 37) % 7) - 3 : 0;
          pts.push([
            lerp(x0, x1, i / n) + j * (0.6 + i * 0.2),
            lerp(y0, y1, i / n),
          ]);
        }
        const reach = k * n;
        for (let i = 0; i < n && i < reach; i++) {
          const f = Math.min(1, reach - i),
            [ax, ay] = pts[i],
            bx = lerp(ax, pts[i + 1][0], f),
            by = lerp(ay, pts[i + 1][1], f),

      /* ================= Player drawing ================= */
      const SWING = 0.26;
